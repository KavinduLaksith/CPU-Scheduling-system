<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Algorithm Comparison</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<button onclick="goBack()" class="back-btn">⬅ Back</button>

<h1>CPU Scheduling Algorithm Comparison</h1>
<br><br>
<br><br>

<!-- INPUT SECTION -->

<div class="input-row">

<div class="input-group">
<label>PID</label>
<input id="pid" placeholder="P1">
</div>

<div class="input-group">
<label>Arrival Time</label>
<input id="arrival" placeholder="0">
</div>

<div class="input-group">
<label>Burst Time</label>
<input id="burst" placeholder="5">
</div>

<div class="input-group">
<label>Priority</label>
<input id="priority" placeholder="1">
</div>

<div class="input-group">
<label>&nbsp;</label>
<button onclick="addProcess()">Add Process</button>
</div>

</div>

<!-- PROCESS TABLE -->

<table id="processTable">

<tr>
<th>PID</th>
<th>Arrival</th>
<th>Burst</th>
<th>Priority</th>
<th>Action</th>
</tr>

</table>

<!-- ALGORITHM SELECTION -->

<div class="panel">

<h2 class="algo-title">Select Algorithms</h2>

<div class="algo-grid">

<label class="algo-card">
<input type="checkbox" value="fcfs" checked>
<div class="algo-box">
<h3>FCFS</h3>
<p>First Come First Serve</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="sjf">
<div class="algo-box">
<h3>SJF</h3>
<p>Shortest Job First</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="priorityLow">
<div class="algo-box">
<h3>Priority (Low)</h3>
<p>Lower value = higher priority</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="priorityHigh">
<div class="algo-box">
<h3>Priority (High)</h3>
<p>Higher value = higher priority</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="rr_fcfs">
<div class="algo-box">
<h3>RR + FCFS</h3>
<p>Round Robin FCFS</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="rr_sjf">
<div class="algo-box">
<h3>RR + SJF</h3>
<p>Round Robin SJF</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="rr_srtf">
<div class="algo-box">
<h3>RR + SRTF</h3>
<p>Round Robin SRTF</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="rr_priorityLow">
<div class="algo-box">
<h3>RR+Priority(Low)</h3>
<p>Round Robin Priority(Low)</p>
</div>
</label>

<label class="algo-card">
<input type="checkbox" value="rr_priorityHigh">
<div class="algo-box">
<h3>RR+Priority(High)</h3>
<p>Round Robin Priority(High)</p>
</div>
</label>

</div>

<br><br>

<label>Time Quantum</label>
<br><br>
<input id="quantum" value="2">

<br><br>

<button onclick="runComparison()">Run Comparison</button>

</div>

<!-- RESULTS -->

<div class="panel">

<h3>Comparison Results</h3>

<div id="comparisonResults"></div>

</div>

<script src="scheduler.js"></script>

<script>

function goBack(){
window.location="index.html"
}

</script>

</body>
</html>
