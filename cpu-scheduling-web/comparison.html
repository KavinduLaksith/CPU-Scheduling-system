<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comparison Mode</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Algorithm Comparison</h1>

<div class="panel">

<input id="pid" placeholder="PID">
<input id="arrival" placeholder="Arrival">
<input id="burst" placeholder="Burst">
<input id="priority" placeholder="Priority">

<button onclick="addProcess()">Add Process</button>

<table id="processTable">

<tr>
<th>PID</th>
<th>Arrival</th>
<th>Burst</th>
<th>Priority</th>
</tr>

</table>

</div>

<div class="panel">

<label><input type="checkbox" value="fcfs" checked> FCFS</label>
<label><input type="checkbox" value="sjf"> SJF</label>
<label><input type="checkbox" value="priority"> Priority</label>
<label><input type="checkbox" value="rr"> Round Robin</label>

<label>Quantum</label>
<input id="quantum" value="2">

<button onclick="runComparison()">Run Comparison</button>

</div>

<div id="comparisonResults"></div>

<script src="scheduler.js"></script>

</body>
</html>
