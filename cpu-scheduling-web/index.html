<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CPU Scheduling Simulator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">CPU Scheduling Simulator</h1>

<div class="container">

<h2>Choose Mode</h2>

<div class="mode-box">

<label class="mode-option">
<input type="radio" name="mode" value="single" checked>

<div class="mode-content">
<img src="single.png">
<div>
<h3>Single Scheduling Mode</h3>
<p>Focus on simulating and fine-tuning a single algorithm simultaneously.</p>
</div>
</div>

</label>



<label class="mode-option">
<input type="radio" name="mode" value="comparison">

<div class="mode-content">
<img src="compare.png">
<div>
<h3>Comparison Mode</h3>
<p>Analyze performance metrics of multiple algorithms simultaneously.</p>
</div>
</div>

</label>

</div>

<button class="next-btn" onclick="goNext()">Next →</button>

</div>


<script>

function goNext(){

let mode=document.querySelector('input[name="mode"]:checked').value

if(mode==="single")
window.location="single.html"

else
window.location="comparison.html"

}

</script>


<style>

body{
font-family:Arial;
margin:0;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#0f172a;
color:white;
}

.title{
margin-bottom:20px;
font-size:34px;
}

.container{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
width:600px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
text-align:center;
}

.mode-box{
margin-top:25px;
display:flex;
flex-direction:column;
gap:20px;
}

.mode-option{
background:rgba(255,255,255,0.2);
border-radius:15px;
padding:15px;
cursor:pointer;
transition:0.3s;
display:block;
}

.mode-option:hover{
transform:scale(1.02);
background:rgba(255,255,255,0.3);
}

.mode-option input{
margin-right:10px;
transform:scale(1.3);
}

.mode-content{
display:flex;
align-items:center;
gap:15px;
}

.mode-content img{
width:70px;
height:70px;
border-radius:10px;
}

.mode-content h3{
margin:0;
}

.mode-content p{
margin:3px 0 0 0;
font-size:14px;
opacity:0.9;
}

.next-btn{
margin-top:30px;
background:linear-gradient(90deg,#3aa0ff,#0066ff);
border:none;
padding:12px 40px;
font-size:18px;
color:white;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

.next-btn:hover{
transform:scale(1.05);
}


 </style>

</body>
</html>
