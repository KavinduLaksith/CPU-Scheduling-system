<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Single Scheduling</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>CPU Scheduling Simulator</h1>

<div class="panel">

<input id="pid" placeholder="PID">
<input id="arrival" placeholder="Arrival Time">
<input id="burst" placeholder="Burst Time">
<input id="priority" placeholder="Priority">

<button onclick="addProcess()">Add Process</button>

<table id="processTable">

<tr>
<th>PID</th>
<th>Arrival</th>
<th>Burst</th>
<th>Priority</th>
</tr>

</table>

</div>

<div class="panel">

<label>Main Algorithm</label>

<select id="algorithm">
<option value="fcfs">FCFS</option>
<option value="sjf">SJF</option>
<option value="priority">Priority</option>
<option value="rr">Round Robin</option>
</select>
<br><br>
<label>Priority Type</label>

<select id="priorityType">
<option value="low">Lower Number = Higher Priority</option>
<option value="high">Higher Number = Higher Priority</option>
</select>

<br><br>

<label>Round Robin Queue Policy</label>

<select id="rrPolicy">
<option value="fcfs">FCFS</option>
<option value="sjf">SJF</option>
<option value="srtf">SRTF</option>
<option value="priorityLow">Priority (Low value higher)</option>
<option value="priorityHigh">Priority (High value higher)</option>
</select>

<br><br>

<label>Time Quantum</label>
<input id="quantum" value="2">

<button onclick="run()">Run Simulation</button>

</div>

<div class="panel">

<h3>Gantt Chart</h3>
<div id="ganttChart" class="gantt"></div>

</div>

<div class="panel">

<table id="resultTable">

<tr>
<th>PID</th>
<th>Completion</th>
<th>TAT</th>
<th>WT</th>
</tr>

</table>

<p id="avgTat"></p>
<p id="avgWt"></p>

</div>

<script src="scheduler.js"></script>

</body>
</html>
